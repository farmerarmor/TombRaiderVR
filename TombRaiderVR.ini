[VR]
; Restart the game after editing these settings.
; Immersive HUD and menus: 1.0 = current size, 0.75 = smaller, 1.25 = larger.
; Valid range: 0.25 to 2.0. Does not resize the F6 virtual screen.
HUDScale=1.0

; Experimental: retain native gameplay camera through scripted camera blends,
; and disable camera shake/rotation/FOV effects. Mouse/stick orbit is retained.
; Enter VR during gameplay before testing a sequence. Does not skip events
; or modify pre-rendered movies. Stalled cameras accept raw mouse/right-stick
; orbit without re-enabling gameplay actions during a cutscene.
; 0 restores normal game camera effects. F6 returns to the virtual screen.
DisableScriptedCamera=0

; Automatically enter VR in gameplay and use the screen during cutscenes.
; F6 overrides the current scene until the next gameplay/cutscene transition.
; 0 restores fully manual F6 switching.
AutoSwitchVR=1

; With AutoSwitchVR=1: 1 renders in-game cutscenes in full VR.
; 0 (default) uses the virtual screen. Prerecorded movies still use the screen.
InGameCutscenesInVR=0

; 1 steers native weapon aim with headset yaw/pitch while aiming in VR.
; Mouse/stick still turn the aim. 0 keeps normal input-based aiming.
HeadAim=0
